name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Signed APK
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      LENSASSIST_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # An unsigned release APK cannot be installed, so fail loudly rather than
      # attaching something nobody can use.
      - name: Require signing secrets
        if: env.SIGNING_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Release signing secrets are not configured. Set SIGNING_KEYSTORE_BASE64 and SIGNING_KEYSTORE_PASSWORD (see README)."
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
          echo "LENSASSIST_KEYSTORE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          apk="LensAssist-${TAG}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$TAG" "$apk" --clobber

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sideload.jks"
